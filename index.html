<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <script>
      // Dark is the default look; only an explicit "light" choice removes it.
      // Runs before paint so there is no light flash on load.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#236b56');
        }
      } catch (error) {
        /* storage blocked — keep the dark default */
      }
    </script>
    <meta
      name="description"
      content="Billing and payments dashboard for a residential building."
    />
    <title>Building Ledger</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
